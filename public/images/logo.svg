<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sapa-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677ff" />
      <stop offset="60%" stop-color="#0958d9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sapa-grad-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sapa-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1677ff" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ICON CONTAINER (Squircle Mark) -->
  <g transform="translate(8, 8)" filter="url(#sapa-shadow)">
    <!-- Base App Container -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#sapa-grad-primary)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="0.5" y="0.5" width="79" height="79" rx="21.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

    <!-- Chat Message Bubble Shape -->
    <path d="M 22 28 C 22 23 26 19 31 19 L 49 19 C 54 19 58 23 58 28 L 58 43 C 58 48 54 52 49 52 L 35 52 L 26 59 L 27 52 L 31 52 C 26 52 22 48 22 43 Z" 
          fill="#ffffff" 
          fill-opacity="0.95" />

    <!-- Alert / Bell & Pulse Wave Node Inside -->
    <!-- Alert Bell Silhouette / Node -->
    <path d="M 40 27 C 37 27 34.5 29.5 34.5 32.5 L 34.5 38.5 L 32 41 L 48 41 L 45.5 38.5 L 45.5 32.5 C 45.5 29.5 43 27 40 27 Z" 
          fill="#1677ff" />
    <circle cx="40" cy="43.5" r="1.5" fill="#1677ff" />

    <!-- Emerald Alert Signal Beacon Dot -->
    <circle cx="58" cy="22" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="58" cy="22" r="3" fill="#ffffff" />
    
    <!-- Dynamic Sound / Automation Waves (Right side) -->
    <path d="M 48 31 C 50 33 50 37 48 39" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(108, 0)">
    <!-- Main Acronym: SAPA -->
    <text x="0" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" letter-spacing="-1.2" fill="#0f172a">
      SAPA
    </text>
    
    <!-- Alert Automation Badge Indicator -->
    <rect x="135" y="21" width="58" height="20" rx="6" fill="#e6f4ff" stroke="#91caff" stroke-width="1" />
    <text x="141" y="35" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#1677ff" letter-spacing="0.5">
      ENGINE
    </text>

    <!-- Subtitle: Sistem Automasi Pesan & Alert -->
    <text x="1" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="0.3" fill="#64748b">
      SISTEM AUTOMASI PESAN &amp; ALERT
    </text>

    <!-- Micro Tech Indicator Dots -->
    <circle cx="218" cy="65" r="2.5" fill="#10b981" />
    <text x="226" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#10b981" letter-spacing="0.2">
      ACTIVE
    </text>
  </g>
</svg>

