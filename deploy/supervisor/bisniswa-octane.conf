[program:bisniswa-octane]
process_name=%(program_name)s_%(process_num)02d
command=php artisan octane:start --server=frankenphp --caddyfile=Caddyfile --host=127.0.0.1 --port=8000 --admin-port=2019 --workers=auto --max-requests=1000
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/bisniswa-octane.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=15
stopsignal=SIGTERM
